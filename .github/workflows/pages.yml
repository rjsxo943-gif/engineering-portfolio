name: Deploy portfolio to GitHub Pages
# Publishing authorized by the owner on 2026-11-09.
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Require generated portfolio PDF
        run: test -s public/downloads/engineering-portfolio.pdf
      - run: npm run build
        env:
          PAGES_BASE: /engineering-portfolio/
      # Pages must be enabled by the repository owner before this workflow runs.
      # GitHub App tokens cannot create a Pages site via configure-pages.
      - name: Verify GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/pages" > /dev/null 2>&1; then
            echo "::error::Enable Settings > Pages > Build and deployment > Source: GitHub Actions, then rerun this workflow."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
